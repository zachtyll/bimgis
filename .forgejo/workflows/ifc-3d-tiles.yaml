name: IFC to 3D Tiles

on: [push]
  # push:
  #   paths:
  #     - '**/*.dvc'
  #     - 'dvc.yaml'
  #     - 'dvc.lock'

jobs:
  convert:
    runs-on: docker
    container:
      options: "--network ci-net"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3 \
            python3-pip \
            python3-venv

          python3 -m venv .venv
          . .venv/bin/activate

          pip install --upgrade pip
          pip install py3dtiles boto3 dvc[s3]
          which dvc
          dvc version

      - name: Run DVC pipeline
        run: |
          .venv/bin/dvc pull
          .venv/bin/dvc repro
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET }}

