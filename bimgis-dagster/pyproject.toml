[project]
name = "bimgis_dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "boto3>=1.43.18",
    "dagster==1.13.7",
    "ifcopenshell>=0.8.5",
    "py3dtiles>=12.1.1",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bimgis_dagster"
registry_modules = [
    "bimgis_dagster.components.*",
]


