quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,OPTIONS
quarkus.http.cors.headers=*

# Identity: bearer tokens from Keycloak (docs/decisions/0005-identity-oidc-keycloak.md).
# Dev: docker compose -f infra/keycloak/docker-compose.yaml up -d
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/bimgis}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=roles
# Tests use @TestSecurity instead of a running Keycloak.
%test.quarkus.oidc.enabled=false

# Database: in dev/test, Quarkus Dev Services starts Postgres in Docker automatically.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# JSON columns (comment.viewpoint) use a DB-specific mapper, independent of the REST ObjectMapper.
quarkus.hibernate-orm.mapping.format.global=ignore
