openapi: 3.0.2
info:
  title: BCF API
  version: "3.0"
servers:
- description: SwaggerHub API Auto Mocking
  url: https://virtserver.swaggerhub.com/opencde/BCF-OpenAPI-3.0/3.0
- url: /
paths:
  /bcf/{version}/projects:
    get:
      description: Retrieve a collection of projects where the currently logged on
        user has access to.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - project_id: F445F4F2-4D02-4B2A-B612-5E456BEF9137
                name: Example project 1
                authorization:
                  project_actions:
                  - createTopic
                  - createDocument
              - project_id: A233FBB2-3A3B-EFF4-C123-DE22ABC8414
                name: Example project 2
                authorization:
                  project_actions: []
              schema:
                $ref: "#/components/schemas/projects"
          description: OK
      summary: Get Projects
      tags:
      - Project
  /bcf/{version}/projects/{project_id}:
    get:
      description: Retrieve a specific project.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                project_id: B724AAC3-5B2A-234A-D143-AE33CC18414
                name: Example project 3
                authorization:
                  project_actions:
                  - update
              schema:
                $ref: "#/components/schemas/project_GET"
          description: OK
      summary: Get Project
      tags:
      - Project
    put:
      description: "Modify a specific project. This operation is only possible when\
        \ the server returns the update flag in the Project authorization, see section\
        \ 3.1.5"
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/project_PUT"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                project_id: B724AAC3-5B2A-234A-D143-AE33CC18414
                name: Example project 3 - Second Section
                authorization:
                  project_actions:
                  - update
              schema:
                $ref: "#/components/schemas/project_GET"
          description: OK
      summary: Update Project
      tags:
      - Project
  /bcf/{version}/projects/{project_id}/extensions:
    get:
      description: |
        Retrieve a specific projects extensions. Project extensions are used to define possible values that can be used in topics and comments, for example topic labels and priorities.
        They may change during the course of a project. The most recent extensions state which values are valid at a given moment for newly created topics and comments.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                topic_type:
                - Information
                - Error
                topic_status:
                - Open
                - Closed
                - ReOpened
                topic_label:
                - Architecture
                - Structural
                - MEP
                snippet_type:
                - .ifc
                - .csv
                priority:
                - Low
                - Medium
                - High
                users:
                - Architect@example.com
                - BIM-Manager@example.com
                - bob_heater@example.com
                stage:
                - Preliminary Planning End
                - Construction Start
                - Construction End
                project_actions:
                - update
                - createTopic
                - createDocument
                topic_actions:
                - update
                - updateBimSnippet
                - updateRelatedTopics
                - updateDocumentReferences
                - updateFiles
                - createComment
                - createViewpoint
                comment_actions:
                - update
              schema:
                $ref: "#/components/schemas/extensions_GET"
          description: OK
      summary: Get Project Extensions
      tags:
      - Project
  /bcf/{version}/projects/{project_id}/topics:
    get:
      description: Retrieve a collection of topics related to a project (default sort
        order is creation_date).
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Filter items by property values, see [OData Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)

          |parameter|type|description|
          |---------|----|-----------|
          |creation_author|string|userId of the creation author (value from extensions)|
          |modified_author|string|userId of the modified author (value from extensions)|
          |assigned_to|string|userId of the assigned person (value from extensions)|
          |stage|string|stage this topic is part of (value from extensions)|
          |topic_status|string|status of a topic (value from extensions)|
          |topic_type|string|type of a topic (value from extensions)|
          |creation_date|datetime|creation date of a topic|
          |modified_date|datetime|modification date of a topic|
          |labels|array (string)|labels of a topic (value from extensions)|
          |priority|string|priority of a topic (value from extensions)|
        example: assigned_to eq 'Architect@example.com' and topic_status eq 'Open'
          and creation_date gt 2015-12-05T00:00:00+01:00
        explode: true
        in: query
        name: $filter
        required: false
        schema:
          type: string
        style: form
      - description: "Filter items by property values, see [OData Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)\n\
          \n|parameter|description|\n|---------|-----------|\n|creation_date|creation\
          \ date of a topic|\n|modified_date|modification date of a topic|\n|server_assigned_id|the\
          \ server_assigned_id of the topic|\n|index|index of a topic|   \n"
        example: modified_date desc
        explode: true
        in: query
        name: $orderby
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: $top
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: $skip
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - guid: A245F4F2-2C01-B43B-B612-5E456BEF8116
                server_assigned_id: ISSUE-00001
                creation_author: Architect@example.com
                title: Example topic 1
                labels:
                - Architecture
                - Structural
                creation_date: 2013-10-21T17:34:22.409Z
              - guid: A211FCC2-3A3B-EAA4-C321-DE22ABC8414
                server_assigned_id: ISSUE-00078
                creation_author: Architect@example.com
                title: Example topic 2
                labels:
                - Architecture
                - Heating
                - Electrical
                creation_date: 2014-11-19T14:24:11.316Z
              schema:
                items:
                  $ref: "#/components/schemas/topic_GET"
                type: array
          description: OK
      summary: Get Topics
      tags:
      - Topics
    post:
      description: "Add a new topic. This operation is only possible when the server\
        \ returns the createTopic flag in the Project authorization, see section 3.1.5"
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              topic_type: Clash
              topic_status: open
              title: Example topic 3
              priority: high
              labels:
              - Architecture
              - Heating
              assigned_to: harry.muster@example.com
              bim_snippet:
                snippet_type: clash
                is_external: true
                reference: https://example.com/bcf/1.0/ADFE23AA11BCFF444122BB
                reference_schema: https://example.com/bcf/1.0/clash.xsd
            schema:
              $ref: "#/components/schemas/topic_POST"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                guid: A245F4F2-2C01-B43B-B612-5E456BEF8116
                server_assigned_id: ISSUE-01462
                creation_author: Architect@example.com
                creation_date: 2016-08-01T17:34:22.409Z
                topic_type: Clash
                topic_status: open
                title: Example topic 3
                priority: high
                labels:
                - Architecture
                - Heating
                assigned_to: harry.muster@example.com
                bim_snippet:
                  snippet_type: clash
                  is_external: true
                  reference: https://example.com/bcf/1.0/ADFE23AA11BCFF444122BB
                  reference_schema: https://example.com/bcf/1.0/clash.xsd
              schema:
                $ref: "#/components/schemas/topic_GET"
          description: Created
      summary: Create Topic
      tags:
      - Topics
  /bcf/{version}/projects/{project_id}/topics/{topic_id}:
    delete:
      description: "Deletes a single topic. This operation is only possible when the\
        \ server returns the delete flag in the Topic authorization, see section 3.2.8"
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Delete Topic
      tags:
      - Topics
    get:
      description: Retrieve a specific topic.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                guid: B345F4F2-3A04-B43B-A713-5E456BEF8228
                server_assigned_id: ISSUE-00549
                creation_author: Architect@example.com
                creation_date: 2016-08-01T17:34:22.409Z
                topic_type: Clash
                topic_status: open
                title: Example topic 3
                priority: high
                labels:
                - Architecture
                - Heating
                assigned_to: harry.muster@example.com
                bim_snippet:
                  snippet_type: clash
                  is_external: true
                  reference: https://example.com/bcf/1.0/ADFE23AA11BCFF444122BB
                  reference_schema: https://example.com/bcf/1.0/clash.xsd
                authorization:
                  topic_actions:
                  - createComment
                  - createViewpoint
              schema:
                $ref: "#/components/schemas/topic_GET"
          description: OK
      summary: Get Topic
      tags:
      - Topics
    put:
      description: |
        Modify a specific topic, description similar to POST. This operation is only possible when the server returns
        the update flag in the Topic authorization, see section 3.2.8
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              topic_type: Clash
              topic_status: open
              title: Example topic 3 - Changed Title
              priority: high
              labels:
              - Architecture
              - Heating
              assigned_to: harry.muster@example.com
              bim_snippet:
                snippet_type: clash
                is_external: true
                reference: https://example.com/bcf/1.0/ADFE23AA11BCFF444122BB
                reference_schema: https://example.com/bcf/1.0/clash.xsd
            schema:
              $ref: "#/components/schemas/topic_PUT"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                guid: B345F4F2-3A04-B43B-A713-5E456BEF8228
                server_assigned_id: ISSUE-00037
                creation_author: Architect@example.com
                creation_date: 2016-08-01T17:34:22.409Z
                modified_author: Architect@example.com
                modified_date: 2016-08-02T13:22:22.409Z
                topic_type: Clash
                topic_status: open
                title: Example topic 3 - Changed Title
                priority: high
                labels:
                - Architecture
                - Heating
                assigned_to: harry.muster@example.com
                bim_snippet:
                  snippet_type: clash
                  is_external: true
                  reference: https://example.com/bcf/1.0/ADFE23AA11BCFF444122BB
                  reference_schema: https://example.com/bcf/1.0/clash.xsd
              schema:
                $ref: "#/components/schemas/topic_GET"
          description: OK
      summary: Update Topic
      tags:
      - Topics
  /bcf/{version}/projects/{project_id}/topics/{topic_id}/snippet:
    get:
      description: Retrieves a topics BIM-Snippet as binary file.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
      summary: Get Snippet
      tags:
      - Snippets
    put:
      description: |
        Puts a new BIM Snippet binary file to a topic. If this is used, the parent topics BIM Snippet property is_external must
        be set to false and the reference must be the file name with extension. This operation is only possible when the server returns the updateBimSnippet
        flag in the Topic authorization, see section 3.2.8
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          description: OK
      summary: Update Snippet
      tags:
      - Snippets
  /bcf/{version}/projects/{project_id}/files_information:
    get:
      description: |
        Retrieve a collection of project_file_informations to support allowing users to choose which Files (models)
        to reference in the header of topics created on the server.
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - display_information:
                - field_display_name: Model Name
                  field_value: ARCH-Z100-051
                - field_display_name: Revision Date
                  field_value: May 3 2020
                file:
                  ifc_project: 0J$yPqHBD12v72y4qF6XcD
                  file_name: OfficeBuilding_Architecture_0001.ifc
                  reference: https://example.com/files/0J$yPqHBD12v72y4qF6XcD_0001.ifc
              - display_information:
                - field_display_name: Model Name
                  field_value: MEP-Z100-015
                - field_display_name: Revision Date
                  field_value: Apr 30 2020
                file:
                  ifc_project: 3hwBHP91jBRwPsmyf$3Hea
                  file_name: OfficeBuilding_Heating_0003.ifc
                  reference: cf37bae6-0900-46be-b37f-b34754fe0b4a
              schema:
                $ref: "#/components/schemas/project_files_information_GET"
          description: OK
      summary: Get Files Information
      tags:
      - Files
  /bcf/{version}/projects/{project_id}/topics/{topic_id}/files:
    get:
      description: "Retrieve a collection of file references as topic header. \nImplementer\
        \ Note: The reference property can either be an Uri or a server specific id.\n\
        Uris are given as absolute paths to the model files while ids reference a\
        \ custom id of the model file and require custom logic per server to retrieve\
        \ it.\nThis allows referencing of files on the server but requires clients\
        \ to know how to retrieve files in a specific implementation.\n"
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
              - ifc_project: 0J$yPqHBD12v72y4qF6XcD
                file_name: OfficeBuilding_Architecture_0001.ifc
                reference: https://example.com/files/0J$yPqHBD12v72y4qF6XcD_0001.ifc
              - ifc_project: 3hwBHP91jBRwPsmyf$3Hea
                file_name: OfficeBuilding_Heating_0003.ifc
                reference: cf37bae6-0900-46be-b37f-b34754fe0b4a
              schema:
                items:
                  $ref: "#/components/schemas/file_GET"
                type: array
          description: OK
      summary: Get Files
      tags:
      - Files
    put:
      description: |
        Update a collection of file references on the topic header. This operation is only possible when the server returns the updateFiles flag in the Topic authorization,
        see section 3.2.8
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
            - ifc_project: 0J$yPqHBD12v72y4qF6XcD
              filename: OfficeBuilding_Architecture_0001.ifc
              reference: https://example.com/files/0J$yPqHBD12v72y4qF6XcD_0001.ifc
            - ifc_project: 3hwBHP91jBRwPsmyf$3Hea
              filename: OfficeBuilding_Heating_0003.ifc
              reference: https://example.com/files/3hwBHP91jBRwPsmyf$3Hea_0003.ifc
            schema:
              items:
                $ref: "#/components/schemas/file_PUT"
              type: array
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
              - ifc_project: 0J$yPqHBD12v72y4qF6XcD
                file_name: OfficeBuilding_Architecture_0001.ifc
                reference: https://example.com/files/0J$yPqHBD12v72y4qF6XcD_0001.ifc
              - ifc_project: 3hwBHP91jBRwPsmyf$3Hea
                file_name: OfficeBuilding_Heating_0003.ifc
                reference: https://example.com/files/3hwBHP91jBRwPsmyf$3Hea_0003.ifc
              schema:
                items:
                  $ref: "#/components/schemas/file_GET"
                type: array
          description: OK
      summary: Update File
      tags:
      - Files
  /bcf/{version}/projects/{project_id}/topics/{topic_id}/comments:
    get:
      description: Retrieve a collection of all comments related to a topic (default
        ordering is date).
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      - description: |
          Filter items by property values, see [OData Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)

          |parameter|type|description|
          |---------|----|-----------|
          |author|string|userId of the author (value from extensions)|
          |date|datetime|creation date of a comment|
        example: assigned_to eq 'Architect@example.com' and topic_status eq 'Open'
          and creation_date gt 2015-12-05T00:00:00+01:00
        explode: true
        in: query
        name: $filter
        required: false
        schema:
          type: string
        style: form
      - description: |
          Filter items by property values, see [OData Filtering](http://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html#sec_SystemQueryOptionfilter)

          |parameter|description|
          |---------|-----------|
          |date|creation date of a comment|
        example: modified_date desc
        explode: true
        in: query
        name: $orderby
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
              - guid: C4215F4D-AC45-A43A-D615-AA456BEF832B
                date: 2016-08-01T12:34:22.409Z
                author: max.muster@example.com
                comment: Clash found
                topic_guid: B345F4F2-3A04-B43B-A713-5E456BEF8228
                authorization:
                  comment_actions:
                  - update
              - guid: A333FCA8-1A31-CAAC-A321-BB33ABC8414
                date: 2016-08-01T14:24:11.316Z
                author: bob.heater@example.com
                comment: will rework the heating model
                topic_guid: B345F4F2-3A04-B43B-A713-5E456BEF8228
              schema:
                items:
                  $ref: "#/components/schemas/comment_GET"
                type: array
          description: OK
      summary: Get Comments
      tags:
      - Comments
    post:
      description: "Add a new comment to a topic. This operation is only possible\
        \ when the server returns the createComment flag in the Topic authorization,\
        \ see section 3.2.8"
      parameters:
      - explode: false
        in: path
        name: version
        required: true
        schema:
          default: "3.0"
          type: string
        style: simple
      - explode: false
        in: path
        name: project_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: topic_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              comment: will rework the heating model
            schema:
              $ref: "#/components/schemas/comment_POST"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
