# Worked example: Detaljplan för del av centrum, fastigheten Katten 6 (Luleå, KLF2023/1459).
# Sources: "Planbeskrivning [Antagande] KLF 2023-1459 DP Katten 6 260120.pdf" (data/example-planning-data/), and
# the plan map "Plankarta [G] KLF 2023-1459 DP Katten 6" (granskningshandling, 2025-10-21, lulea.se): provision
# areas, wordings and the plan boundary are digitised from it (scripts/digitise_plankarta.py).
# Hand-entered as an official would through the UI, with the plan map's geometry. Investigations
# and findings are a subset. IDs are readable keys here; the platform uses uuids.

organisations:
  - { id: org-lulea, name: Luleå kommun, role: [kommun] }
  - { id: org-afry, name: Afry, role: [konsult] }
  - { id: org-tyrens, name: Tyréns, role: [konsult] }
  - { id: org-clarholm, name: Clarholm Energi- & Klimatanalys AB, role: [konsult] }
  - { id: org-fastighet, name: Folkets Energihus AB, role: [exploator] }

plan:
  id: plan-katten6
  caseNumber: KLF2023/1459
  municipality: Luleå
  name: Detaljplan för del av centrum, fastigheten Katten 6
  purpose: >
    Möjliggöra ny bebyggelse i upp till 15 våningar på Katten 6, som idag är en parkering,
    och förtäta centrum med centrumverksamhet och bostäder.
  planType: detaljplan
  procedure: utokat
  status: antagen
  properties: [Luleå Katten 6, Luleå Innerstaden 2:1]
  # The plan map's plan boundary, EPSG:3006. Within 0.3 m (max 4.9 m at one corner) of the boundary in
  # Luleå's open data (GNG_detaljplaner_pagande, ARENDENR KLF2023-1459).
  area:
    type: MultiPolygon
    coordinates: [[[[829353.51, 7292446.58], [829360.12, 7292429.85], [829351.73, 7292426.6], [829360.75, 7292403.77], [829365.72, 7292391.24], [829375.01, 7292392.24], [829375.71, 7292390.47], [829366.41, 7292389.46], [829369.44, 7292381.8], [829377.84, 7292385.1], [829376.75, 7292387.84], [829404.5, 7292398.46], [829387.87, 7292440.56], [829412.54, 7292450.09], [829405.12, 7292466.49], [829353.51, 7292446.58]]]]
  previousPlans: [A068]   # "Kv Kaninen, Haren, Uttern, Mården, Hermelinen, Hunden, Katten mfl", laga kraft 1965-03-01
  externalRefs:
    - { system: lulea-arcgis, id: KLF2023-1459 }   # open data still says "Samråd pågår" (stale, see doc 05)
  applicant: org-fastighet
  significantEnvironmentalImpact: false
  implementationMonths: 120
  opCompliance:
    compliant: false
    deviation: "ÖP 2021 'tät struktur': 4–5 floors, max 10–12 for single projects. Plan allows 15 (45 m)."
    motive: Densification strategy; Norra hamn identified as suitable for taller buildings.
    supportedBy: [doc-planprogram-2011]

stageEvents:
  - { id: se-1, plan: plan-katten6, stage: samrad, startDate: 2023-12-01 }   # date not stated in the PB; illustrative
  - { id: se-2, plan: plan-katten6, stage: granskning, startDate: 2025-11-01 } # "slutet av 2025"; illustrative
  - { id: se-3, plan: plan-katten6, stage: antagande, startDate: 2026-01-20 }

documents:
  - { id: doc-pb-antagande, plan: plan-katten6, documentType: planbeskrivning, title: "Planbeskrivning [Antagande] KLF 2023-1459 DP Katten 6", stage: antagande, date: 2026-01-20, public: true }
  - { id: doc-planprogram-2011, plan: plan-katten6, documentType: planprogram, title: "Planprogram Norra hamn (KF 2011-10-17 § 227)", stage: program, date: 2011-10-17, public: true }
  - { id: doc-buller, plan: plan-katten6, documentType: utredning, title: Trafikbullerutredning, stage: samrad, date: 2023-10-05, public: true }
