  - { id: doc-dagvatten-2024, plan: plan-katten6, documentType: utredning, title: PM Dagvattenhantering, stage: granskning, date: 2024-06-28, public: true, supersedes: doc-dagvatten-2023 }
  - { id: doc-miljoteknik, plan: plan-katten6, documentType: utredning, title: Miljöteknisk undersökning, stage: granskning, date: 2024-06-28, public: true }

investigations:
  - id: inv-buller
    plan: plan-katten6
    type: bullerutredning
    area: utredningar
    title: Trafikbullerutredning
    status: delivered
    author: org-tyrens
    date: 2023-10-05
    stage: samrad
    report: doc-buller
    summary: Traffic on Skeppsbrogatan makes the lower floors facing the street too noisy for housing.
  - { id: inv-dagsljus, plan: plan-katten6, type: dagsljus_och_skugga, area: utredningar, title: Dagsljusberäkning, status: delivered, author: org-clarholm, date: 2023-10-02, stage: samrad }
  - { id: inv-dagvatten-2023, plan: plan-katten6, type: dagvattenutredning, area: utredningar, title: PM Dagvattenhantering, status: superseded, author: org-afry, date: 2023-04-18, stage: samrad, report: doc-dagvatten-2023 }
  - { id: inv-dagvatten-2024, plan: plan-katten6, type: dagvattenutredning, area: utredningar, title: PM Dagvattenhantering, status: delivered, author: org-afry, date: 2024-06-28, stage: granskning, report: doc-dagvatten-2024, supersedes: inv-dagvatten-2023 }
  - { id: inv-geoteknik, plan: plan-katten6, type: geoteknisk_utredning, area: utredningar, title: Geotekniskt utlåtande, status: delivered, author: org-afry, date: 2023-11-14, stage: samrad }
  - { id: inv-miljoteknik, plan: plan-katten6, type: markmiljoutredning, area: utredningar, title: Miljöteknisk undersökning, status: delivered, author: org-afry, date: 2024-06-28, stage: granskning, report: doc-miljoteknik }

observations:
  - id: obs-24AF005
    kind: sample
    label: 24AF005 (2–2.5 m)
    location: { type: Point, coordinates: [829385, 7292425] }   # approximate, inside the plan area; exact position in Bild 28
    depthFrom: 2.0
    depthTo: 2.5
    method: Lab analysis of soil sample
    investigation: inv-miljoteknik
    source: org-afry
    values: []   # lab values are in the investigation report, not the planbeskrivning (Ba, Cu, Zn > MKM)
  - id: obs-facade-skeppsbrogatan
    kind: calculation
    label: Façade Skeppsbrogatan, floors 1–6
    location: { type: Point, coordinates: [829380, 7292455, 10] }  # approximate: street façade, ~3rd floor
    method: Nordic road traffic noise model (Tyréns)
    investigation: inv-buller
    values:
      - { parameter: Leq, value: 63, unit: dB(A), kind: max }

norms:
  - code: SFS-2015-216
    title: Riktvärden för trafikbuller vid bostadsbyggnader
    source: Förordning (2015:216) om trafikbuller vid bostadsbyggnader
    thresholds:
      - { parameter: Leq, value: 60, unit: dB(A), kind: max, context: at façade }

findings:
  - id: f-buller
    plan: plan-katten6
    topic: bullerutredning
    statement: Up to 63 dBA Leq on floors 1–6 facing Skeppsbrogatan; ≤ 60 dBA from floor 7.
    value: { parameter: Leq, value: 63, unit: dB(A), kind: max }
    norm: SFS-2015-216
    assessment: exceeds
    basedOn: [inv-buller]
    evidence: [obs-facade-skeppsbrogatan]
    stage: samrad
    consequences:
      - { kind: provision, provision: prov-B1 }
  - id: f-dagsljus
    plan: plan-katten6
    topic: dagsljus_och_skugga
    statement: Lower floors do not reach daylight guidelines.
    assessment: exceeds
    basedOn: [inv-dagsljus]
    stage: samrad
    consequences:
      - { kind: provision, provision: prov-B1 }
  - id: f-dagvatten
    plan: plan-katten6
    topic: dagvattenutredning
    statement: Flow increases after development (20-year rain, 10 min, climate factor 1.25). Infiltration is risky because of contamination.
    assessment: exceeds
    basedOn: [inv-dagvatten-2024]
    stage: granskning
    consequences:
      - { kind: recommendation, text: "Sealed underground pipe storage of 14.5 m³; connect in Skeppsbrogatan in consultation with Lumire." }
  - id: f-geoteknik
    plan: plan-katten6
    topic: geoteknisk_utredning
    statement: Basement foundation likely feasible, but loads and ground pressure are unknown.
    assessment: uncertain
    basedOn: [inv-geoteknik]
    stage: samrad
    consequences:
      - { kind: obligation, obligation: obl-geoteknik }
  - id: f-markmiljo
    plan: plan-katten6
    topic: markmiljoutredning
    statement: 1 of 13 samples above MKM (Ba, Cu, Zn), 2 above KM (metals, PAH-H, PFOS).
    # norm: Naturvårdsverket's generella riktvärden (KM/MKM). Add as a Norm with the real table values.
    assessment: exceeds
    basedOn: [inv-miljoteknik]
    evidence: [obs-24AF005]
    stage: granskning
    consequences:
      - { kind: obligation, obligation: obl-massor }

